import java.security.MessageDigest

plugins {
    id "com.android.application"
}

def prodStoreFile = project.findProperty("GHZ_STORE_FILE") ?: ""
def prodStorePassword = project.findProperty("GHZ_STORE_PASSWORD") ?: ""
def prodKeyAlias = project.findProperty("GHZ_KEY_ALIAS") ?: ""
def prodKeyPassword = project.findProperty("GHZ_KEY_PASSWORD") ?: ""
def expectedCertSha256 = project.findProperty("GHZ_EXPECTED_CERT_SHA256") ?: ""
def hasProdSigning = prodStoreFile && prodStorePassword && prodKeyAlias && prodKeyPassword && expectedCertSha256

// Android updates are accepted reliably only when the incoming APK has a higher
// versionCode. QA builds therefore get a monotonic second-resolution code unless
// CI/production explicitly supplies GHZ_VERSION_CODE.
def explicitVersionCode = project.findProperty("GHZ_VERSION_CODE") ?: System.getenv("GHZ_VERSION_CODE")
def utcNow = java.time.ZonedDateTime.now(java.time.ZoneOffset.UTC)
def versionEpoch = java.time.LocalDate.of(2020, 1, 1)
def autoVersionCode = (java.time.temporal.ChronoUnit.DAYS.between(versionEpoch, utcNow.toLocalDate()) * 86400L
        + utcNow.getHour() * 3600L + utcNow.getMinute() * 60L + utcNow.getSecond()) as int
def ghzVersionCode = explicitVersionCode ? Integer.parseInt(String.valueOf(explicitVersionCode)) : autoVersionCode
def ghzVersionName = String.valueOf(project.findProperty("GHZ_VERSION_NAME") ?: System.getenv("GHZ_VERSION_NAME") ?: "14.0.4")

def voskModelName = "vosk-model-small-de-0.15"
def voskModelSha256 = "b7e53c90b1f0a38456f4cd62b366ecd58803cd97cd42b06438e2c131713d5e43"
def voskModelUrls = [
        "https://alphacephei.com/vosk/models/${voskModelName}.zip",
        "https://github.com/BartekReterski/VoskModels/releases/download/v1/${voskModelName}.zip"
]
def voskCacheDir = new File(rootProject.projectDir, ".gradle/vosk-model-cache")
def voskZip = new File(voskCacheDir, "${voskModelName}.zip")
def voskGeneratedAssetsDir = file("$buildDir/generated/voskAssets")

def sha256File = { File fileToHash ->
    MessageDigest digest = MessageDigest.getInstance("SHA-256")
    fileToHash.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

android {
    namespace "com.foad.ghazaldeutsch"
    compileSdk 35

    defaultConfig {
        applicationId "com.foad.ghazaldeutsch"
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode ghzVersionCode
        versionName ghzVersionName
        buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", "false"
        buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""
        buildConfigField "boolean", "FINAL_RELEASE_BUILD", "false"
        buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "true"
        buildConfigField "String", "RELEASE_CHANNEL", "\"qa\""
    }

    sourceSets {
        main {
            assets.srcDir voskGeneratedAssetsDir
        }
    }

    signingConfigs {
        if (hasProdSigning) {
            production {
                storeFile file(prodStoreFile)
                storePassword prodStorePassword
                keyAlias prodKeyAlias
                keyPassword prodKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", hasProdSigning ? "true" : "false"
            buildConfigField "String", "EXPECTED_CERT_SHA256", "\"${expectedCertSha256}\""
            buildConfigField "boolean", "FINAL_RELEASE_BUILD", "true"
            buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "false"
            buildConfigField "String", "RELEASE_CHANNEL", "\"production\""
            if (hasProdSigning) signingConfig signingConfigs.production
        }
        debug {
            minifyEnabled false
            buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", "false"
            buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""
            buildConfigField "boolean", "FINAL_RELEASE_BUILD", "false"
            buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "true"
            buildConfigField "String", "RELEASE_CHANNEL", "\"debug\""
        }
        hardenedQa {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            matchingFallbacks = ["release"]
            buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", "false"
            buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""
            buildConfigField "boolean", "FINAL_RELEASE_BUILD", "false"
            buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "true"
            buildConfigField "String", "RELEASE_CHANNEL", "\"hardened-qa\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("prepareVoskGermanModel") {
    outputs.dir(voskGeneratedAssetsDir)
    doLast {
        voskCacheDir.mkdirs()
        if (!voskZip.exists() || sha256File(voskZip) != voskModelSha256) {
            if (voskZip.exists()) voskZip.delete()
            Exception lastFailure = null
            for (String url : voskModelUrls) {
                try {
                    logger.lifecycle("Downloading pinned GHAZAL German speech model from ${url}")
                    URLConnection connection = new URL(url).openConnection()
                    connection.setConnectTimeout(30_000)
                    connection.setReadTimeout(120_000)
                    connection.setRequestProperty("User-Agent", "GHAZAL-Android-Build")
                    voskZip.withOutputStream { output ->
                        connection.getInputStream().withCloseable { input -> input.transferTo(output) }
                    }
                    if (sha256File(voskZip) != voskModelSha256) {
                        throw new GradleException("Downloaded Vosk model checksum mismatch")
                    }
                    lastFailure = null
                    break
                } catch (Exception failure) {
                    lastFailure = failure
                    if (voskZip.exists()) voskZip.delete()
                    logger.warn("Vosk model download failed from ${url}: ${failure.message}")
                }
            }
            if (lastFailure != null || !voskZip.exists()) {
                throw new GradleException("Unable to obtain pinned German Vosk model", lastFailure)
            }
        }

        if (sha256File(voskZip) != voskModelSha256) {
            throw new GradleException("Cached German Vosk model checksum mismatch")
        }

        delete(voskGeneratedAssetsDir)
        voskGeneratedAssetsDir.mkdirs()
        copy {
            from zipTree(voskZip)
            into voskGeneratedAssetsDir
        }

        File modelRoot = new File(voskGeneratedAssetsDir, voskModelName)
        if (!new File(modelRoot, "am/final.mdl").isFile() || !new File(modelRoot, "conf/mfcc.conf").isFile()) {
            throw new GradleException("German Vosk model archive is incomplete")
        }
        logger.lifecycle("Prepared bundled offline German speech model: ${voskModelName}")
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareVoskGermanModel")
}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "net.java.dev.jna:jna:5.18.1@aar"
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    androidTestImplementation "androidx.test:core:1.5.0"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { t ->
        t.path == ":app:assembleRelease" || t.path == ":app:bundleRelease" || t.path == ":app:packageRelease"
    }
    if (releaseRequested && !hasProdSigning) {
        throw new GradleException("Production release requires GHZ_STORE_FILE, GHZ_STORE_PASSWORD, GHZ_KEY_ALIAS, GHZ_KEY_PASSWORD and GHZ_EXPECTED_CERT_SHA256")
    }
}
