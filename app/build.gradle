plugins {
    id "com.android.application"
}

def prodStoreFile = project.findProperty("GHZ_STORE_FILE") ?: ""
def prodStorePassword = project.findProperty("GHZ_STORE_PASSWORD") ?: ""
def prodKeyAlias = project.findProperty("GHZ_KEY_ALIAS") ?: ""
def prodKeyPassword = project.findProperty("GHZ_KEY_PASSWORD") ?: ""
def expectedCertSha256 = project.findProperty("GHZ_EXPECTED_CERT_SHA256") ?: ""
def hasProdSigning = prodStoreFile && prodStorePassword && prodKeyAlias && prodKeyPassword && expectedCertSha256

android {
    namespace "com.foad.ghazaldeutsch"
    compileSdk 35

    defaultConfig {
        applicationId "com.foad.ghazaldeutsch"
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName "14.0.1"
        buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", "false"
        buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""
        buildConfigField "boolean", "FINAL_RELEASE_BUILD", "false"
        buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "true"
        buildConfigField "String", "RELEASE_CHANNEL", "\"qa\""
    }

    signingConfigs {
        if (hasProdSigning) {
            production {
                storeFile file(prodStoreFile)
                storePassword prodStorePassword
                keyAlias prodKeyAlias
                keyPassword prodKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", hasProdSigning ? "true" : "false"
            buildConfigField "String", "EXPECTED_CERT_SHA256", "\"${expectedCertSha256}\""
            buildConfigField "boolean", "FINAL_RELEASE_BUILD", "true"
            buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "false"
            buildConfigField "String", "RELEASE_CHANNEL", "\"production\""
            if (hasProdSigning) signingConfig signingConfigs.production
        }
        debug {
            minifyEnabled false
            buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", "false"
            buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""
            buildConfigField "boolean", "FINAL_RELEASE_BUILD", "false"
            buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "true"
            buildConfigField "String", "RELEASE_CHANNEL", "\"debug\""
        }
        hardenedQa {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            matchingFallbacks = ["release"]
            buildConfigField "boolean", "PRODUCTION_SIGNING_ENABLED", "false"
            buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""
            buildConfigField "boolean", "FINAL_RELEASE_BUILD", "false"
            buildConfigField "boolean", "QA_INTERNAL_TOOLS_ENABLED", "true"
            buildConfigField "String", "RELEASE_CHANNEL", "\"hardened-qa\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { t ->
        t.path == ":app:assembleRelease" || t.path == ":app:bundleRelease" || t.path == ":app:packageRelease"
    }
    if (releaseRequested && !hasProdSigning) {
        throw new GradleException("Production release requires GHZ_STORE_FILE, GHZ_STORE_PASSWORD, GHZ_KEY_ALIAS, GHZ_KEY_PASSWORD and GHZ_EXPECTED_CERT_SHA256")
    }
}
