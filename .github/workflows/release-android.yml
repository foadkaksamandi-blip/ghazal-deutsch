name: Production Android Release

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: "Short release note"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Require production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.GHZ_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GHZ_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GHZ_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.GHZ_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            test -n "${!v}" || { echo "Missing required production signing secret: $v"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ghazal-release.jks"
          chmod 600 "$RUNNER_TEMP/ghazal-release.jks"
      - name: Fetch and verify licensed human-native audio
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/human_audio
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/9/91/De-guten_Tag2.ogg" -o app/src/main/assets/human_audio/De-guten_Tag2.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/f/f7/De-Wie_geht_es_dir..ogg" -o app/src/main/assets/human_audio/De-Wie_geht_es_dir..ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/a/aa/De-Schritt_f%C3%BCr_Schritt.ogg" -o app/src/main/assets/human_audio/De-Schritt_fuer_Schritt.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/d/d3/De-darstellen.ogg" -o app/src/main/assets/human_audio/De-darstellen.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/6/69/De-eintragen.ogg" -o app/src/main/assets/human_audio/De-eintragen.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/8/83/De-at-deutsch.ogg" -o app/src/main/assets/human_audio/De-at-deutsch.ogg
          printf '%s\n'             '52239a77cb6ade337d273c077336cc98ba38dfad  app/src/main/assets/human_audio/De-guten_Tag2.ogg'             'e9fb264843ff4d2d1e4e90a7bb9524ffd1a02021  app/src/main/assets/human_audio/De-Wie_geht_es_dir..ogg'             'fde4f9c0f3d9938a7a05b825b9329c3edaee7366  app/src/main/assets/human_audio/De-Schritt_fuer_Schritt.ogg'             '6d8f96905effb7683f87edcdf658ea48196cd752  app/src/main/assets/human_audio/De-darstellen.ogg'             'b1bf2c650e0e87f9064176cbba773f8c1fcbd1f6  app/src/main/assets/human_audio/De-eintragen.ogg'             '8d601b6f82ab724df230fecee65a374cf1bb75c5  app/src/main/assets/human_audio/De-at-deutsch.ogg' > /tmp/human_audio.sha1
          sha1sum -c /tmp/human_audio.sha1
      - name: Generate bundled asset integrity manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("app/src/main/assets")
          sec=root/"security"; sec.mkdir(parents=True,exist_ok=True)
          files={}
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  rel=p.relative_to(root).as_posix()
                  if rel!="security/asset-integrity.json":
                      files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          (sec/"asset-integrity.json").write_text(json.dumps({"version":1,"algorithm":"SHA-256","files":files},sort_keys=True,separators=(",",":")),encoding="utf-8")
          PY
      - name: Run tests and source checks
        run: |
          npm test
          npm run check
      - name: Build signed production APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.GHZ_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GHZ_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.GHZ_CERT_SHA256 }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace             -PGHZ_STORE_FILE="$RUNNER_TEMP/ghazal-release.jks"             -PGHZ_STORE_PASSWORD="$STORE_PASSWORD"             -PGHZ_KEY_ALIAS="$KEY_ALIAS"             -PGHZ_KEY_PASSWORD="$KEY_PASSWORD"             -PGHZ_EXPECTED_CERT_SHA256="$CERT_SHA256"
      - name: Verify production signature and release hardening
        env:
          CERT_SHA256: ${{ secrets.GHZ_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK" && test -f "$AAB"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"
          if $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "application-debuggable"; then exit 1; fi
      - name: Rename production artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk GHAZAL-v13-production.apk
          cp app/build/outputs/bundle/release/app-release.aab GHAZAL-v13-production.aab
      - name: Upload signed production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GHAZAL-v13-production
          path: |
            GHAZAL-v13-production.apk
            GHAZAL-v13-production.aab
          if-no-files-found: error
          retention-days: 30
