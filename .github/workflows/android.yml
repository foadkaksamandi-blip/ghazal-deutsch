name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate offline course data
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GHAZAL-v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GHAZAL-v3
          path: GHAZAL-v3.apk
          if-no-files-found: error
          retention-days: 90
