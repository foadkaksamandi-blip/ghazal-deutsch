name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch licensed human-native audio pack
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/human_audio
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/9/91/De-guten_Tag2.ogg" -o app/src/main/assets/human_audio/De-guten_Tag2.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/f/f7/De-Wie_geht_es_dir..ogg" -o app/src/main/assets/human_audio/De-Wie_geht_es_dir..ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/a/aa/De-Schritt_f%C3%BCr_Schritt.ogg" -o app/src/main/assets/human_audio/De-Schritt_fuer_Schritt.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/d/d3/De-darstellen.ogg" -o app/src/main/assets/human_audio/De-darstellen.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/6/69/De-eintragen.ogg" -o app/src/main/assets/human_audio/De-eintragen.ogg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/8/83/De-at-deutsch.ogg" -o app/src/main/assets/human_audio/De-at-deutsch.ogg
          printf '%s\n'             '52239a77cb6ade337d273c077336cc98ba38dfad  app/src/main/assets/human_audio/De-guten_Tag2.ogg'             'e9fb264843ff4d2d1e4e90a7bb9524ffd1a02021  app/src/main/assets/human_audio/De-Wie_geht_es_dir..ogg'             'fde4f9c0f3d9938a7a05b825b9329c3edaee7366  app/src/main/assets/human_audio/De-Schritt_fuer_Schritt.ogg'             '6d8f96905effb7683f87edcdf658ea48196cd752  app/src/main/assets/human_audio/De-darstellen.ogg'             'b1bf2c650e0e87f9064176cbba773f8c1fcbd1f6  app/src/main/assets/human_audio/De-eintragen.ogg'             '8d601b6f82ab724df230fecee65a374cf1bb75c5  app/src/main/assets/human_audio/De-at-deutsch.ogg' > /tmp/human_audio.sha1
          sha1sum -c /tmp/human_audio.sha1
      - name: Generate bundled asset integrity manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("app/src/main/assets")
          sec=root/"security"
          sec.mkdir(parents=True, exist_ok=True)
          files={}
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              rel=p.relative_to(root).as_posix()
              if rel=="security/asset-integrity.json":
                  continue
              files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          (sec/"asset-integrity.json").write_text(json.dumps({"version":1,"algorithm":"SHA-256","files":files},sort_keys=True,separators=(",",":")),encoding="utf-8")
          print("integrity files",len(files))
          PY
      - name: Scan client source for embedded secrets
        run: |
          python - <<'PY'
          import pathlib,re,sys
          roots=[pathlib.Path("app/src/main/java"),pathlib.Path("app/src/main/assets")]
          pats=[
            re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
            re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
            re.compile(r"AIza[0-9A-Za-z_-]{20,}"),
            re.compile(r"(?i)(?:api[_-]?key|client[_-]?secret)\s*[:=]\s*['\"][^'\"]{8,}['\"]")
          ]
          bad=[]
          for root in roots:
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix in {".js",".java",".json",".xml",".html"}:
                      text=p.read_text("utf-8",errors="ignore")
                      if any(rx.search(text) for rx in pats): bad.append(str(p))
          if bad:
              print("Potential embedded secrets:",*bad,sep="\n")
              sys.exit(1)
          print("secret scan PASS")
          PY
      - name: Validate Stage 5 and 6 complete candidate
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build hardened non-debuggable QA APK
        run: gradle :app:assembleHardenedQa --stacktrace
      - name: Verify hardened APK
        run: |
          APK="app/build/outputs/apk/hardenedQa/app-hardenedQa.apk"
          test -f "$APK"
          apksigner verify --verbose --print-certs "$APK"
          if aapt dump badging "$APK" | grep -q "application-debuggable"; then
            echo "Hardened QA APK is debuggable"
            exit 1
          fi
      - name: Name APK
        run: cp app/build/outputs/apk/hardenedQa/app-hardenedQa.apk GHAZAL-v12-stage5-6-hardened-qa.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GHAZAL-v12-stage5-6-hardened-qa
          path: GHAZAL-v12-stage5-6-hardened-qa.apk
          if-no-files-found: error
          retention-days: 90
