name: Android Physical-Touch Interaction Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile app and instrumentation tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable"
            exit 1
          fi
      - name: Run real WebView physical-touch tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Collect interaction test evidence
        if: always()
        run: |
          mkdir -p qa/interaction-device
          cp -R app/build/reports/androidTests/connected/debug qa/interaction-device/report 2>/dev/null || true
          cp -R app/build/outputs/androidTest-results/connected qa/interaction-device/results 2>/dev/null || true
          find qa/interaction-device -maxdepth 4 -type f | sort || true
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GHAZAL-v14-1-physical-touch-regression
          path: qa/interaction-device
          if-no-files-found: warn
          retention-days: 30
